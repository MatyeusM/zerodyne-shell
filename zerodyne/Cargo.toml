[package]
name = "zerodyne"
version = "0.1.0"
edition = "2024"
description = "Rust rewrite of the zerodyne local daemon (review candidate)"

[lib]
name = "zerodyne"
path = "src/lib.rs"

[[bin]]
name = "zerodyne"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Size-first: this is a short-lived local daemon, not a compute benchmark.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
